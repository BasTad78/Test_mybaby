<link rel="stylesheet" href="pages/profil.css">

<div class="profile-container">
  <div class="profile-grid">
    <!-- Sidebar: Basic Info -->
    <aside class="profile-sidebar">
      <div class="card glass-card">
        <div class="avatar-header">
          <img id="display-avatar" src="https://ui-avatars.com/api/?name=User&background=random&color=fff&size=128"
            alt="Avatar">
          <div id="display-pseudo" class="pseudo">Chargement...</div>
          <div id="display-role" class="role-tag">Joueur</div>
        </div>

        <div class="stats-overview">
          <div class="stat-pill">
            <span class="stat-val" id="stat-elo">...</span>
            <span class="stat-lbl">Points ELO</span>
          </div>
        </div>

        <div class="menu-list">
          <button class="menu-item active">👤 Informations</button>
          <button id="btnSettings" class="menu-item">⚙️ Paramètres</button>
          <button id="btnLogout" class="menu-item logout">🚪 Déconnexion</button>
        </div>
      </div>
    </aside>

    <!-- Main Content: Details & Babyfoots -->
    <main class="profile-main">
      <section class="card">
        <h2 style="margin-top:0">Détails du compte</h2>
        <div class="info-grid">
          <div class="info-box">
            <label>Adresse Email</label>
            <div id="display-email">...</div>
          </div>
          <div class="info-box">
            <label>Date d'inscription</label>
            <div id="display-date">...</div>
          </div>
        </div>
      </section>

      <section class="card" style="margin-top:24px">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
          <h2 style="margin:0">Mes Babyfoots</h2>
          <button id="btnAddBabyfoot" class="btn primary">＋ Ajouter</button>
        </div>
        <div id="babyfoot-list" class="bars-list">
          <div class="loader-sm">Récupération...</div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Modal Ajout Babyfoot -->
<div id="babyfootModal" class="modal" aria-hidden="true">
  <div class="modal-content">
    <button id="closeBabyfootModal" class="modal-close"
      style="position:absolute; right:15px; top:15px; background:none; border:none; font-size:24px; cursor:pointer">×</button>
    <h2 style="margin-top:0">Ajouter un Babyfoot</h2>
    <form id="babyfootForm" style="display:flex; flex-direction:column; gap:12px">
      <div>
        <label style="font-weight:700">Nom du lieu</label>
        <input name="nom_lieu" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd" required
          placeholder="Ex: Bar des Amis">
      </div>
      <div>
        <label style="font-weight:700">Adresse</label>
        <input name="adresse" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd" required
          placeholder="12 rue de Paris">
      </div>
      <div style="display:flex; gap:10px">
        <div style="flex:1">
          <label style="font-weight:700">Ville</label>
          <input name="ville" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd" required
            placeholder="Paris">
        </div>
        <div style="flex:1">
          <label style="font-weight:700">Modèle</label>
          <select id="modelSelect" name="id_modele"
            style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd"></select>
        </div>
      </div>
      <button type="submit" class="btn primary" style="margin-top:10px">Enregistrer</button>
    </form>
  </div>
</div>

<style>
  .profile-grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 32px;
  }

  .glass-card {
    background: linear-gradient(135deg, #fff 0%, #f9f9f9 100%);
    border: 1px solid rgba(0, 0, 0, 0.05);
  }

  .avatar-header {
    text-align: center;
    padding: 20px 0;
  }

  #display-avatar {
    width: 120px;
    height: 120px;
    border-radius: 30px;
    object-fit: cover;
    border: 4px solid #fff;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    margin-bottom: 15px;
  }

  .pseudo {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--gris-fonce);
  }

  .role-tag {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--rouge);
    font-weight: 700;
    margin-top: 5px;
  }

  .stats-overview {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }

  .stat-pill {
    background: #fff;
    padding: 12px 24px;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    text-align: center;
  }

  .stat-val {
    display: block;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--rouge);
  }

  .stat-lbl {
    font-size: 0.7rem;
    color: #999;
    text-transform: uppercase;
  }

  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
  }

  .menu-item {
    background: transparent;
    border: none;
    padding: 12px 16px;
    border-radius: 12px;
    text-align: left;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    color: #666;
  }

  .menu-item:hover {
    background: #fff;
    transform: translateX(5px);
  }

  .menu-item.active {
    background: var(--rouge);
    color: #fff;
  }

  .menu-item.logout:hover {
    color: var(--rouge);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 15px;
  }

  .info-box {
    background: #fdfdfd;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #f0f0f0;
  }

  .info-box label {
    display: block;
    font-size: 0.75rem;
    color: #999;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .info-box div {
    font-weight: 700;
    color: var(--gris-fonce);
  }

  .bar-item-p {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    border-bottom: 1px solid #eee;
  }

  .bar-item-p:last-child {
    border: none;
  }
</style>

<script type="module">
  import { userService } from './services/userService.js';
  import { babyfootService } from './services/babyfootService.js';

  (async function () {
    'use strict';

    const rawUser = localStorage.getItem('mybaby_user');
    if (!rawUser) {
      window.location.hash = '#login';
      return;
    }

    const user = JSON.parse(rawUser);
    const uid = user.id_utilisateur || user.id;

    async function loadProfile() {
      try {
        const profile = await userService.getProfile(uid);
        document.getElementById('display-pseudo').textContent = profile.pseudo;
        document.getElementById('display-email').textContent = profile.email || 'Non renseigné';
        document.getElementById('display-date').textContent = profile.date_inscription ? new Date(profile.date_inscription).toLocaleDateString() : 'Inconnue';
        document.getElementById('stat-elo').textContent = profile.elo_score || 1500;
        document.getElementById('display-role').textContent = "Compte " + (profile.role || 'joueur');

        document.getElementById('display-avatar').src = profile.photo_profil || `https://ui-avatars.com/api/?name=${profile.pseudo}&background=random&color=fff&size=128`;
      } catch (err) {
        console.error("Profile load err:", err);
        // If 401/404, maybe session is dead
        if (err.message.includes('40')) {
          localStorage.removeItem('mybaby_user');
          window.location.hash = '#login';
        }
      }
    }

    async function loadMyBabyfoots() {
      const listContainer = document.getElementById('babyfoot-list');
      try {
        const data = await babyfootService.getAllBabyfoots();
        const myBars = data.filter(b => b.id_utilisateur === uid);

        if (myBars.length > 0) {
          listContainer.innerHTML = myBars.map(b => `
                        <div class="bar-item-p">
                            <div>
                                <div style="font-weight:700">${b.nom_lieu}</div>
                                <small style="color:#999">${b.ville}</small>
                            </div>
                            <span class="badge" style="background:#f0f0f0">${b.nom_modele}</span>
                        </div>
                    `).join('');
        } else {
          listContainer.innerHTML = '<div style="padding:40px; text-align:center; color:#999">Vous n\'avez pas encore enregistré de babyfoot.</div>';
        }
      } catch (err) {
        listContainer.innerHTML = '<div style="padding:20px; color:var(--rouge)">Erreur de chargement.</div>';
      }
    }

    document.getElementById('btnLogout').onclick = () => {
      if (confirm("Voulez-vous vous déconnecter ?")) {
        localStorage.removeItem('mybaby_user');
        window.location.hash = '#home';
      }
    };

    // Logic for Add Babyfoot
    document.getElementById('btnAddBabyfoot').onclick = async () => {
      try {
        const models = await babyfootService.getModels();
        const select = document.getElementById('modelSelect');
        select.innerHTML = models.map(m => `<option value="${m.id_modele}">${m.marque} ${m.nom_modele}</option>`).join('');
        document.getElementById('babyfootModal').classList.add('show');
      } catch (e) {
        alert("Erreur lors de la récupération des modèles.");
      }
    };

    document.getElementById('closeBabyfootModal').onclick = () => {
      document.getElementById('babyfootModal').classList.remove('show');
    };

    document.getElementById('babyfootForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const payload = Object.fromEntries(formData.entries());
      payload.id_utilisateur = uid;

      try {
        await babyfootService.createBabyfoot(payload);
        alert("Babyfoot ajouté avec succès !");
        document.getElementById('babyfootModal').classList.remove('show');
        loadMyBabyfoots();
      } catch (err) {
        alert("Erreur lors de l'ajout : " + err.message);
      }
    };

    await loadProfile();
    await loadMyBabyfoots();
  })();
</script>
